<body>
<title>Constelación COCO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna de celular (máx 520px) sobre un cielo nocturno a pantalla completa;
   la fogata (resplandor durazno) abajo, las estrellas de los jugadores arriba. Tema único, nocturno, a propósito. */
:root {
  --noche: #04162B;      /* fondo profundo */
  --navy: #082F59;       /* COCO navy */
  --azul: #185FA5;       /* COCO blue */
  --cielo: #6AABE0;      /* COCO sky */
  --verde: #3EB48A;      /* COCO green */
  --durazno: #E8A87C;    /* COCO peach = fogata */
  --hielo: #F0F7FF;      /* COCO ice = texto */
  --tenue: #9DB6D3;      /* texto secundario */
  --linea: rgba(240,247,255,.14);
  --carta: #0C2A4D;
  --acto: #F6C667;       /* cambia por acto */
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--noche); color: var(--hielo);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  overscroll-behavior-y: none; -webkit-text-size-adjust: 100%;
}
button, .btn, .chip, .opcion, .carta { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#cielo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.fogata {
  position: fixed; left: 50%; bottom: -38vh; width: 140vw; height: 70vh; transform: translateX(-50%);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--acto) 34%, transparent), transparent 75%);
  opacity: .55; z-index: 0; pointer-events: none; transition: background 1.2s ease;
  animation: respira 5s ease-in-out infinite;
}
@keyframes respira { 50% { opacity: .75; } }

#app {
  position: relative; z-index: 1; max-width: 520px; margin: 0 auto;
  min-height: 100%; min-height: 100dvh; padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-block: 18px 28px;
  display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); font-weight: 600; }
.muted { color: var(--tenue); }
p { margin: 0; }

/* Botones */
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cielo); outline-offset: 3px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding-inline: 22px; border-radius: 999px; font-weight: 600; font-size: 16px;
  transition: transform .15s ease, background .2s ease, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn-fuego { background: var(--durazno); color: #2A1406; box-shadow: 0 8px 30px -8px color-mix(in srgb, var(--durazno) 70%, transparent); }
.btn-acto { background: var(--acto); color: #061424; }
.btn-ghost { background: rgba(240,247,255,.07); border: 1px solid var(--linea); }
.btn-text { color: var(--tenue); min-height: 44px; padding-inline: 12px; font-weight: 500; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* HOME */
.home { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding-top: 4vh; }
.home .oso { width: 150px; filter: drop-shadow(0 18px 40px rgba(232,168,124,.35)); animation: flota 6s ease-in-out infinite; }
@keyframes flota { 50% { transform: translateY(-10px) rotate(-1.5deg); } }
.titulo {
  font-size: clamp(48px, 15vw, 76px); font-weight: 800; line-height: .95;
  background: linear-gradient(180deg, var(--hielo) 30%, var(--durazno));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.home .bajada { font-size: 18px; max-width: 30ch; color: var(--hielo); opacity: .9; }
.fichas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.ficha { font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linea); color: var(--tenue); }
.home .acciones { width: 100%; display: grid; gap: 10px; margin-top: 6px; }
.como { text-align: left; width: 100%; border-top: 1px solid var(--linea); padding-top: 16px; display: grid; gap: 12px; }
.como li { color: var(--tenue); }
.como ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.como b { color: var(--hielo); font-weight: 600; }
.firma { margin-top: auto; padding-top: 22px; font-size: 13px; color: var(--tenue); display: flex; align-items: center; gap: 8px; justify-content: center; }
.firma a { color: var(--cielo); text-decoration: none; }

/* SETUP */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.setup { display: grid; gap: 22px; padding-top: 8px; }
.setup h2 { font-size: 32px; }
.nombres { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nombre { position: relative; }
.nombre input {
  width: 100%; min-height: 52px; border-radius: 16px; border: 1px solid var(--linea);
  background: rgba(240,247,255,.05); color: var(--hielo); font: inherit; padding: 0 14px 0 38px;
}
.nombre input::placeholder { color: rgba(157,182,211,.6); }
.nombre .pto { position: absolute; left: 14px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--hielo); box-shadow: 0 0 10px var(--cielo); }
.contador { display: flex; align-items: center; gap: 12px; }
.contador button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--linea); font-size: 22px; line-height: 1; }
.contador span { font-variant-numeric: tabular-nums; min-width: 6ch; text-align: center; }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opcion { text-align: left; padding: 14px; border-radius: 18px; border: 1px solid var(--linea); background: rgba(240,247,255,.04); display: grid; gap: 2px; }
.opcion strong { font-family: var(--f-display); font-size: 18px; }
.opcion span { font-size: 13px; color: var(--tenue); }
.opcion[aria-pressed="true"] { border-color: var(--durazno); background: color-mix(in srgb, var(--durazno) 14%, transparent); }
.campo { display: grid; gap: 10px; }
.campo-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* PACTO */
.pacto { display: grid; gap: 20px; padding-top: 10px; }
.pacto h2 { font-size: 34px; }
.reglas { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.regla { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 18px; background: rgba(240,247,255,.045); border: 1px solid var(--linea); }
.regla .n { font-family: var(--f-display); font-weight: 800; color: var(--durazno); font-size: 22px; line-height: 1.1; }
.regla b { display: block; font-weight: 600; }
.regla span { color: var(--tenue); font-size: 14px; }
.cuidado { font-size: 13px; color: var(--tenue); border-left: 2px solid var(--verde); padding-left: 12px; }
.manos { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.mano { width: 38px; height: 38px; border-radius: 50%; border: 1px dashed var(--linea); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--tenue); transition: all .3s; }
.mano.on { border: 1px solid var(--durazno); background: var(--durazno); color: #2A1406; transform: scale(1.06); }

/* ACTO INTRO */
.acto-intro { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; padding-block: 6vh; }
.acto-intro .num { font-family: var(--f-display); font-weight: 800; font-size: 120px; line-height: .85; color: var(--acto); text-shadow: 0 0 60px color-mix(in srgb, var(--acto) 50%, transparent); animation: aparece .9s cubic-bezier(.2,.8,.2,1) both; }
.acto-intro h2 { font-size: 46px; animation: aparece .9s .12s cubic-bezier(.2,.8,.2,1) both; }
.acto-intro p { max-width: 32ch; font-size: 18px; animation: aparece .9s .24s cubic-bezier(.2,.8,.2,1) both; }
.emo-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--acto) 50%, transparent); color: var(--acto); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
@keyframes aparece { from { opacity: .001; transform: translateY(14px); } }

/* JUEGO */
.hud { display: grid; gap: 10px; }
.hud-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.progreso { display: flex; gap: 4px; flex: 1; }
.progreso i { flex: 1; height: 4px; border-radius: 4px; background: rgba(240,247,255,.12); }
.progreso i.hecho { background: var(--acto); }
.progreso i.ahora { background: var(--hielo); }
.icono-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--linea); color: var(--tenue); flex: none; }
.mini { display: flex; align-items: center; gap: 12px; }
.mini svg { width: 74px; height: 74px; flex: none; }
.lector { font-size: 14px; color: var(--tenue); }
.lector b { color: var(--hielo); font-weight: 600; }

.mesa { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding-block: 14px; }
.carta-wrap { perspective: 1400px; }
.carta {
  position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 60vh; max-height: 58dvh; max-width: calc(58dvh * .75); margin-inline: auto;
  transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.75,.2,1);
}
.carta.volteada { transform: rotateY(180deg); }
.cara {
  position: absolute; inset: 0; border-radius: 28px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  overflow: hidden; display: flex; flex-direction: column; padding: 24px;
}
.dorso {
  background:
    radial-gradient(120% 80% at 50% 110%, color-mix(in srgb, var(--acto) 40%, transparent), transparent 60%),
    linear-gradient(160deg, var(--azul), var(--navy) 60%, var(--noche));
  border: 1px solid color-mix(in srgb, var(--acto) 40%, transparent);
  align-items: center; justify-content: center; text-align: center; gap: 14px;
}
.dorso .oso-mini { width: 92px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.dorso h3 { font-size: 26px; }
.dorso .toca { font-size: 14px; color: var(--hielo); opacity: .75; animation: late 2.2s ease-in-out infinite; }
@keyframes late { 50% { opacity: .35; } }
.dorso .tipo-dorso { position: absolute; top: 20px; left: 0; right: 0; }
.frente {
  transform: rotateY(180deg);
  background: linear-gradient(170deg, #F7FBFF, #E9F2FC);
  color: var(--navy); gap: 14px;
}
.frente::after { content: ""; position: absolute; inset: 0; border-radius: 28px; box-shadow: inset 0 0 0 6px color-mix(in srgb, var(--acto) 85%, white); pointer-events: none; }
.frente .cabeza { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tipo { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--azul); }
.acto-tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--acto) 30%, white); color: var(--navy); }
.pregunta { font-family: var(--f-display); font-weight: 600; font-size: clamp(23px, 6.4vw, 30px); line-height: 1.18; margin-block: auto; text-wrap: pretty; overflow-wrap: anywhere; }
.pregunta .nom { color: var(--azul); font-weight: 800; }
.frente .pie { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 12px; color: #4F6E91; }
.frente .pie img { width: 34px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: var(--hielo); color: var(--navy); font-weight: 600; box-shadow: 0 12px 40px rgba(0,0,0,.35); animation: aparece .35s ease both, sale .4s 1.8s ease forwards; white-space: nowrap; }
.toast img { width: 34px; height: 34px; object-fit: contain; }
@keyframes sale { to { opacity: 0; transform: translate(-50%, 10px); } }
.dos { display: grid; gap: 10px; margin-block: auto; }
.opc { text-align: left; padding: 14px 16px; border-radius: 18px; background: rgba(24,95,165,.07); border: 1px solid rgba(24,95,165,.18); font: 600 17px/1.3 var(--f-display); color: var(--navy); }
.opc .nom { color: var(--azul); }
.opc:hover { background: rgba(24,95,165,.13); }
.estrella-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #7F97B4; background: rgba(8,47,89,.06); }
.estrella-btn[aria-pressed="true"] { color: #D98A4E; background: #FCE9DC; }

.acciones-carta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
.panel { display: grid; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(4,22,43,.72); border: 1px solid var(--linea); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: aparece .45s ease both; }
.panel h3 { font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding-inline: 14px; border-radius: 999px; border: 1px solid var(--linea); background: rgba(240,247,255,.05); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.chip .d { width: 10px; height: 10px; border-radius: 50%; }
.chip.sel { background: var(--hielo); color: var(--navy); border-color: var(--hielo); }

.cuenta { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(4,22,43,.82); }
.cuenta span { font-family: var(--f-display); font-weight: 800; font-size: 40vw; max-font-size: 220px; color: var(--acto); animation: late .9s ease-out; }
.cuenta span.ya { font-size: 16vw; }

.timer { display: flex; align-items: center; gap: 14px; }
.timer svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.timer .t { font-family: var(--f-display); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* RESPIRACIÓN */
.respira { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 26px; }
.burbuja { width: 220px; height: 220px; max-width: 70vw; max-height: 70vw; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--cielo) 35%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--cielo) 50%, transparent); transform: scale(.55); }
.burbuja img { width: 46%; }
.burbuja.inhala { transition: transform 4s ease-in-out; transform: scale(1); }
.burbuja.sostén { transform: scale(1); }
.burbuja.exhala { transition: transform 6s ease-in-out; transform: scale(.55); }
.respira .guia { font-family: var(--f-display); font-size: 30px; font-weight: 600; min-height: 1.3em; }

/* RITUAL */
.ritual { display: grid; gap: 20px; padding-top: 10px; flex: 1; align-content: center; text-align: center; justify-items: center; }
.ritual h2 { font-size: 36px; }
.ritual input { width: 100%; max-width: 340px; min-height: 60px; text-align: center; border-radius: 18px; border: 1px solid var(--linea); background: rgba(240,247,255,.06); color: var(--hielo); font: 600 24px var(--f-display); }
.ritual .acciones { display: grid; gap: 8px; width: 100%; max-width: 340px; }

/* FINAL */
.final { display: grid; gap: 26px; padding-top: 6px; }
.final .hero { text-align: center; display: grid; gap: 8px; justify-items: center; }
.final .hero h2 { font-size: 40px; }
.nombre-const { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--durazno); letter-spacing: .02em; }
.mapa { border-radius: 28px; border: 1px solid var(--linea); background: radial-gradient(90% 70% at 50% 45%, rgba(24,95,165,.35), transparent 70%), rgba(4,22,43,.55); padding: 8px; }
.mapa svg { width: 100%; height: auto; display: block; }
.mapa .linea-viva { stroke-dasharray: 400; stroke-dashoffset: 400; animation: traza 1.6s ease forwards; }
@keyframes traza { to { stroke-dashoffset: 0; } }
.mapa-pie { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px 10px; font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.bloque { display: grid; gap: 12px; }
.bloque h3 { font-size: 22px; }
.barras { display: grid; gap: 10px; }
.barra { display: grid; grid-template-columns: 92px 1fr 28px; gap: 10px; align-items: center; font-size: 14px; }
.barra .riel { height: 12px; border-radius: 12px; background: rgba(240,247,255,.08); overflow: hidden; }
.barra .riel i { display: block; height: 100%; border-radius: 12px; }
.barra .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--tenue); }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lista li { padding: 14px 16px; border-radius: 18px; background: rgba(240,247,255,.05); border: 1px solid var(--linea); }
.lista li b { color: var(--durazno); font-weight: 600; }
.lista .peq { font-size: 12px; color: var(--tenue); display: block; margin-bottom: 4px; letter-spacing: .08em; text-transform: uppercase; }
.cierre { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 6px; }
.cierre img { width: 120px; }
.cierre p { max-width: 34ch; }
.cuidado-final { font-size: 13px; color: var(--tenue); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 380px) {
  .nombres, .opciones { grid-template-columns: 1fr; }
  .cara { padding: 18px; }
  .acto-intro .num { font-size: 92px; }
  .acto-intro h2 { font-size: 38px; }
}
/* celulares cortos (SE, mini) */
@media (max-height: 700px) and (orientation: portrait) {
  .mini svg { width: 56px; height: 56px; }
  .home .oso { width: 110px; }
  .mesa { gap: 12px; padding-block: 8px; }
  .acto-intro { padding-block: 2vh; gap: 12px; }
}
/* celular acostado: carta a la izquierda, controles a la derecha */
@media (orientation: landscape) and (max-height: 540px) {
  #app { max-width: 920px; padding-block: 10px 14px; }
  .mini svg { width: 48px; height: 48px; }
  .hud { gap: 6px; }
  .mesa { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 20px; }
  .carta { height: 72dvh; max-height: 72dvh; width: auto; max-width: none; }
  .carta-wrap { height: 72dvh; }
  .pregunta { font-size: clamp(18px, 4.2dvh, 26px); }
  .acto-intro .num { font-size: 72px; }
  .acto-intro h2 { font-size: 34px; }
  .home { padding-top: 0; }
  .home .oso { width: 90px; }
  .burbuja { width: 150px; height: 150px; }
}
/* tablet y computador: más aire y letra más grande */
@media (min-width: 768px) and (min-height: 700px) {
  #app { max-width: 600px; padding-block: 32px 40px; }
  .pregunta { font-size: 34px; }
  .carta { max-height: 62dvh; max-width: calc(62dvh * .75); }
  .titulo { font-size: 92px; }
}
@media (hover: hover) {
  .btn:hover { filter: brightness(1.08); }
  .chip:hover, .opcion:hover { border-color: var(--tenue); }

    // máximo una silla del centro por acto en noche corta, dos en completa
    const maxH = S.modo === 'corta' ? 1 : 2; let h = 0; const elegidas = [];
    for (const c of pool) { if (elegidas.length >= por[a.key]) break; if (c.t === 'H') { if (h >= maxH) continue; h++; } elegidas.push(c); }
    // en Cariño, cerrar con la carta más cálida (silla del centro o abrazo) si existe
    if (a.key === 'carino') { const ih = elegidas.findIndex((c) => c.t === 'H'); if (ih > -1 && ih !== elegidas.length - 1) elegidas.push(elegidas.splice(ih, 1)[0]); }
    S.restos[a.key] = pool.filter((c) => !elegidas.includes(c));
    elegidas.forEach((c) => {
      const x = asignar(c, a.key);
      // en Lo profundo, quien responde elige entre dos preguntas (como en el juego de Esther Perel)
      if (a.key === 'profundo' && x.t === 'S' && !x.alt) { const j = S.restos[a.key].findIndex((r) => r.t === 'S'); if (j > -1) x.alt = S.restos[a.key].splice(j, 1)[0].q; }
      mazo.push(x);
    });
    if (a.key === 'carino' && typeof CIERRE_CARINO !== 'undefined') mazo.push(asignar(CIERRE_CARINO, a.key));
  });
  delete S._prev; S._prev = {};
  S.mazo = mazo;
}
function pasarCarta() {
  const c = S.mazo[S.i]; const r = S.restos[c.acto] || [];
  if (c.A != null) S.protagonismo[c.A]--; if (c.B != null) S.protagonismo[c.B]--;
  if (!r.length) { siguiente(true); return; }
  if (c.fija) { siguiente(); return; }
  const nueva = r.shift(); r.push({ t: c.t, q: c.q, alt: c.alt, sup: c.sup, secs: c.secs });
  S.mazo[S.i] = asignar(nueva, c.acto); S.fase = 'dorso'; S.votado = null; guardar(); render();
}

}

/* ---------- constelación (SVG) ---------- */
function posiciones(n, r, cx, cy) { return [...Array(n).keys()].map((i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }); }
function constelacion({ size = 74, grande = false, resaltar = [] } = {}) {
  const n = S.jugadores.length, W = grande ? 360 : 100, H = grande ? 340 : 100;
  const r = grande ? 118 : 38, cx = W / 2, cy = grande ? H / 2 + 4 : 50;
  const p = posiciones(n, r, cx, cy);
  const max = Math.max(1, ...Object.values(S.aristas));
  let lineas = '';
  Object.entries(S.aristas).forEach(([k, w], idx) => {
    const [a, b] = k.split('-').map(Number);
    const op = 0.28 + 0.6 * (w / max), sw = (grande ? 1.2 : 0.8) + (grande ? 3 : 1.6) * (w / max);
    lineas += `<line ${grande ? 'class="linea-viva" style="animation-delay:' + (idx * 0.12).toFixed(2) + 's"' : ''} x1="${p[a][0].toFixed(1)}" y1="${p[a][1].toFixed(1)}" x2="${p[b][0].toFixed(1)}" y2="${p[b][1].toFixed(1)}" stroke="#E8A87C" stroke-opacity="${op.toFixed(2)}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round"/>`;
  });
  let nodos = '';
  p.forEach(([x, y], i) => {
    const on = resaltar.includes(i);
    const rad = grande ? 6 + Math.min(6, S.protagonismo[i] * 0.6) : on ? 4.2 : 2.6;
    nodos += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rad * 3).toFixed(1)}" fill="url(#halo)" opacity="${on || grande ? 0.9 : 0.4}"/>`;
    nodos += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${on ? '#FFE6D2' : '#F0F7FF'}"/>`;
    if (grande) {
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1;
      const lx = x + (dx / d) * 26, ly = y + (dy / d) * 24;
      const anchor = Math.abs(dx) < 10 ? 'middle' : dx > 0 ? 'start' : 'end';
      nodos += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" fill="#F0F7FF" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="700" font-size="15">${esc(S.jugadores[i])}</text>`;
      if (S.palabras[i]) nodos += `<text x="${lx.toFixed(1)}" y="${(ly + 16).toFixed(1)}" text-anchor="${anchor}" fill="#E8A87C" font-family="Inter, system-ui, sans-serif" font-style="italic" font-size="12.5">«${esc(S.palabras[i])}»</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" ${grande ? '' : `width="${size}" height="${size}"`} role="img" aria-label="Constelación del grupo: ${Object.keys(S.aristas).length} conexiones">
    <defs><radialGradient id="halo"><stop offset="0" stop-color="#FFE6D2" stop-opacity=".55"/><stop offset="1" stop-color="#FFE6D2" stop-opacity="0"/></radialGradient></defs>${lineas}${nodos}</svg>`;
}

      <p class="cuidado-final">Hecho con cariño por <a href="https://cocohealth.app" target="_blank" rel="noopener" style="color:var(--cielo)">COCO Health</a> · Si alguien necesita apoyo: Línea 106 (Bogotá) · Línea 192, opción 4</p>
    </div>
  </section>`;
}

/* ---------- render ---------- */
function render() {
  const v = { inicio: vInicio, config: vConfig, pacto: vPacto, acto: vActo, respira: vRespira, carta: vCarta, ritual: vRitual, final: vFinal }[S.pantalla];
  setActo(S.pantalla === 'acto' || S.pantalla === 'carta' ? S.mazo[S.i].acto : S.pantalla === 'respira' ? 'profundo' : null);
  $('#app').innerHTML = v();
  if (S.pantalla === 'respira') correrRespira();
  if (S.pantalla === 'ritual') { const inp = $('#palabra'); inp && inp.focus({ preventScroll: true }); }
}
function ir(p) { S.pantalla = p; guardar(); render(); window.scrollTo({ top: 0 }); }

/* ---------- flujo ---------- */
function empezarActoOCarta() {
  const c = S.mazo[S.i], prev = S.mazo[S.i - 1];
  if (!prev || prev.acto !== c.acto) { if (c.acto === 'profundo') return ir('respira'); sActo(); return ir('acto'); }
  ir('carta');
}
function siguiente() {
  S.i++; S.fase = 'dorso'; S.votado = null;
  if (S.i >= S.mazo.length) { S.ritual = 0; sActo(); return ir('ritual'); }
  empezarActoOCarta();
}
function completar() {
  const c = S.mazo[S.i];
  const sumar = (a, b, w = 1) => { const k = clave(a, b); S.aristas[k] = (S.aristas[k] || 0) + w; };
  const n = S.jugadores.length;
  if (c.A != null && c.B != null) sumar(c.A, c.B, 2);
  else if (c.t === 'H' && c.A != null) { for (let i = 0; i < n; i++) if (i !== c.A) sumar(c.A, i, 1); }
  else if (c.A != null) { sumar(c.A, (c.A + 1) % n, 0.5); sumar(c.A, (c.A + n - 1) % n, 0.5); }
  else if (c.t === 'T' || c.t === 'R') { for (let i = 0; i < n; i++) sumar(i, (i + 1) % n, 0.5); }
  S.fase = 'sentir'; sListo(); guardar(); render();
}

let timerId = null;
function correrTimer(secs) {
  clearInterval(timerId); const fin = Date.now() + secs * 1000;
  const tick = () => {
    const rest = Math.max(0, fin - Date.now()); const s = Math.ceil(rest / 1000);
    const e = $('#seg'), aro = $('#aro'); if (!e) { clearInterval(timerId); return; }
    e.textContent = s; aro.setAttribute('stroke-dashoffset', (97.4 * (1 - rest / (secs * 1000))).toFixed(1));
    if (rest <= 0) { clearInterval(timerId); sCampana(); completar(); }
  };
  tick(); timerId = setInterval(tick, 200);
}

let respiraIds = [];
function correrRespira() {
  respiraIds.forEach(clearTimeout); respiraIds = [];
  const b = $('#burbuja'), g = $('#guia'), c = $('#ciclo');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 1200;
  for (let k = 0; k < 3; k++) {
    respiraIds.push(setTimeout(() => { b.className = 'burbuja inhala'; g.textContent = 'Inhalen'; c.textContent = `Respiración ${k + 1} de 3`; tono([392], 3.6, 0.03); }, t)); t += 4000;
    respiraIds.push(setTimeout(() => { b.className = 'burbuja sostén'; g.textContent = 'Sostengan'; }, t)); t += 2000;
    respiraIds.push(setTimeout(() => { b.className = 'burbuja exhala'; g.textContent = 'Exhalen despacio'; tono([293.66], 5.4, 0.025); }, t)); t += 6000;
  }
  respiraIds.push(setTimeout(() => { g.textContent = 'Listos'; c.textContent = 'Ahora sí: Lo profundo.'; }, t));
  respiraIds.push(setTimeout(() => { if (S.pantalla === 'respira') { sActo(); ir('acto'); } }, t + 1400));
  if (reduce) b.style.transform = 'scale(.8)';
}

function contar() {
  const ov = document.createElement('div'); ov.className = 'cuenta'; document.body.appendChild(ov);
  const pasos = ['3', '2', '1', '¡Señalen!']; let k = 0;
  const paso = () => {
    if (k >= pasos.length) { ov.remove(); S.fase = 'voto'; render(); return; }
    ov.innerHTML = `<span class="${k === 3 ? 'ya' : ''}">${pasos[k]}</span>`; tono([k === 3 ? 880 : 523.25], 0.4, 0.06);
    k++; setTimeout(paso, k === 4 ? 1300 : 750);
  };
  paso();
}

let wake = null;
async function pedirWake() { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} }

/* ---------- eventos ---------- */
document.addEventListener('input', (e) => { if (e.target.matches('.nombre input')) S.nombres[+e.target.dataset.i] = e.target.value; });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'palabra') { e.preventDefault(); $('[data-a="palabra"]').click(); }
  if (e.target.matches('.nombre input')) { e.preventDefault(); const nx = $('#nom-' + (+e.target.dataset.i + 1)); nx ? nx.focus() : $('[data-a="aPacto"]').focus(); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  const acciones = {
    nueva: () => { const son = S.sonido; borrar(); S = estadoInicial(); S.sonido = son; ir('config'); },
    continuar: () => { S = leer() || S; render(); pedirWake(); },
    inicio: () => ir('inicio'),
    mas: () => { if (S.n < 8) { S.n++; if (S.nombres.length < S.n) S.nombres.push(''); render(); } },
    menos: () => { if (S.n > 3) { S.n--; render(); } },
    modo: () => { S.modo = el.dataset.m; render(); },
    aConfig: () => ir('config'),
    aPacto: () => {
      S.jugadores = S.nombres.slice(0, S.n).map((v, i) => (v.trim() || 'Persona ' + (i + 1)).slice(0, 14));
      S.manos = 0; ir('pacto');
    },
    mano: () => { S.manos++; tono([392 + S.manos * 60], 0.5, 0.04); render(); },
    empezar: () => {
      armarMazo(); S.i = 0; S.fase = 'dorso'; S.aristas = {}; S.emociones = {}; S.estrellas = []; S.sups = []; S.palabras = [];
      S.inicio = Date.now(); pedirWake(); sActo(); ir('acto');
    },
    aCarta: () => ir('carta'),
    finRespira: () => { respiraIds.forEach(clearTimeout); sActo(); ir('acto'); },
    voltear: () => { if (S.fase !== 'dorso') return; S.fase = 'frente'; sVoltear(); try { navigator.vibrate?.(18); } catch (e) {} guardar(); $('#carta').classList.add('volteada'); setTimeout(render, 820); },
    pasar: () => { celebrarPase(); pasarCarta(); },
    hecho: () => completar(),
    contar: () => contar(),
    voto: () => { const i = +el.dataset.i; const c = S.mazo[S.i]; if (i >= 0 && c.sup) S.sups.push({ p: i, sup: c.sup }); if (i >= 0) S.protagonismo[i]++; completar(); },
    timer: () => { S.fase = 'timer'; render(); correrTimer(S.mazo[S.i].secs); },
    finTimer: () => { clearInterval(timerId); completar(); },
    sentir: () => { const k = el.dataset.k; if (k) { S.emociones[k] = (S.emociones[k] || 0) + 1; el.classList.add('sel'); } setTimeout(siguiente, k ? 260 : 0); },
    estrella: () => {
      const ix = S.estrellas.findIndex((x) => x.i === S.i);
      if (ix > -1) S.estrellas.splice(ix, 1); else { const c = S.mazo[S.i]; S.estrellas.push({ i: S.i, acto: c.acto, txt: texto(c, false) }); tono([1046.5], 0.6, 0.04); }
      guardar(); const on = ix === -1; el.setAttribute('aria-pressed', on); el.setAttribute('aria-label', on ? 'Quitar de momentos guardados' : 'Guardar este momento');
    },
    elegir: () => { const c = S.mazo[S.i]; if (el.dataset.k === 'alt') c.q = c.alt; delete c.alt; tono([587.33], 0.5, 0.04); guardar(); render(); },
    apoyo: () => abrirApoyo(),
    cerrarApoyo: () => $('#apoyo')?.remove(),
    sonido: () => { S.sonido = !S.sonido; guardar(); render(); },
    salir: () => { guardar(); ir('inicio'); },
    palabra: () => { const v = ($('#palabra').value || '').trim(); if (v) S.palabras[S.ritual] = v.split(/\s+/)[0]; avanzaRitual(); },
    palabraPasar: () => avanzaRitual()
  };
  acciones[a] && acciones[a]();
});
function celebrarPase() {
  const frases = ['¡Pasar también es valiente!', 'Pasar es cuidarse. Bien ahí.', 'Sin explicaciones. Siguiente.'];
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<img src="${IMG_FIESTA}" alt=""><span>${frases[Math.floor(Math.random() * frases.length)]}</span>`;
  document.body.appendChild(t); tono([523.25, 659.25], 0.6, 0.04, 0.08);
  setTimeout(() => t.remove(), 2200);
}
function abrirApoyo() {
  if ($('#apoyo')) return;
  const d = document.createElement('div'); d.id = 'apoyo'; d.className = 'cuenta'; d.style.placeItems = 'end center';
  d.innerHTML = `<div class="panel" role="dialog" aria-label="Apoyo" style="max-width:520px;width:calc(100% - 32px);margin-bottom:24px">
    <h3>¿Algo pesó más de la cuenta?</h3>
    <p class="muted">Está bien parar. Pueden pausar el juego, tomar agua, salir a tomar aire o simplemente quedarse cerca. Nadie tiene que explicar nada.</p>
    <ul class="lista">
      <li><span class="peq">Bogotá · 24 horas · gratis</span><b>Línea 106</b> · WhatsApp 300 754 8933</li>
      <li><span class="peq">Colombia · Ministerio de Salud</span><b>Línea 192</b>, opción 4</li>
      <li><span class="peq">Emergencias</span><b>Línea 123</b></li>
    </ul>
    <p class="muted" style="font-size:13px">Constelación es un juego para conectar. No reemplaza la atención de un profesional de salud mental.</p>
    <button class="btn btn-fuego" data-a="cerrarApoyo">Volver al juego</button></div>`;
  d.addEventListener('click', (e) => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);

function avanzaRitual() {
  tono([523.25 + S.ritual * 40], 0.6, 0.04);
  if (S.ritual < S.jugadores.length - 1) { S.ritual++; guardar(); render(); }
  else { sCampana(); ir('final'); }
}

/* ---------- cielo: estrellas y brasas ---------- */
(function cielo() {
  const cv = $('#cielo'), cx = cv.getContext('2d'); let W, H, dpr, estrellas = [], brasas = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    estrellas = [...Array(Math.round((W * H) / 5200))].map(() => ({ x: Math.random() * W, y: Math.random() * H * 0.92, r: Math.random() * 1.3 + 0.2, f: Math.random() * 6.28, v: 0.4 + Math.random() * 1.4 }));
    brasas = [...Array(16)].map(() => nueva());
  }
  function nueva() { return { x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H + Math.random() * 120, vy: 0.25 + Math.random() * 0.55, vx: (Math.random() - 0.5) * 0.25, r: Math.random() * 1.8 + 0.6, vida: 0.6 + Math.random() * 0.4 }; }
  function dibujar(t) {
    cx.clearRect(0, 0, W, H);
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#020C19'); g.addColorStop(0.6, '#05203F'); g.addColorStop(1, '#0A2C52');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    for (const s of estrellas) { const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.f + t * 0.001 * s.v)); cx.globalAlpha = reduce ? 0.7 : a; cx.fillStyle = '#F0F7FF'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.29); cx.fill(); }
    if (!reduce) for (const b of brasas) {
      b.y -= b.vy; b.x += b.vx + Math.sin((t * 0.001) + b.r) * 0.15;
      const alto = 1 - (H - b.y) / (H * 0.55 * b.vida); if (alto <= 0) Object.assign(b, nueva());
      cx.globalAlpha = Math.max(0, Math.min(1, alto)) * 0.8; cx.fillStyle = '#F3B98E'; cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 6.29); cx.fill();
    }
    cx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(dibujar);
  }
  addEventListener('resize', () => { size(); if (reduce) dibujar(0); }); size(); requestAnimationFrame(dibujar);
})();

/* ---------- arranque ---------- */
function start(data) { if (data && data.pantalla) S = data; render(); }
start({});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.pantalla === 'carta') pedirWake(); });
</script>
